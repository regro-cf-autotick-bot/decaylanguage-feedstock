schema_version: 1

context:
  name: decaylanguage
  version: "1.1.0"
  python_min: '3.10'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/decaylanguage-${{ version }}.tar.gz
  sha256: a4d696198aa68e49bbb94c18af2aadd86a61dbb043950d480b206dce57006ca3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - attrs >=22.2.0
    - python-graphviz
    - lark >=1.0.0
    - numpy >=1.26.0
    - pandas >=2.0
    - particle >=1.0.0
    - hepunits >=2.4.0
    - plumbum >=1.9.0

tests:
  - python:
      imports:
        - decaylanguage
        - decaylanguage.data
      pip_check: true
      python_version: ${{ python_min }}.*
about:
  summary: A language to describe particle decays, and tools to work with them.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/scikit-hep/decaylanguage
  repository: https://github.com/scikit-hep/decaylanguage
  documentation: https://decaylanguage.readthedocs.io/

extra:
  recipe-maintainers:
    - chrisburr
    - eduardo-rodrigues
    - conda-forge/scikit-hep
